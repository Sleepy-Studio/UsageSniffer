[project]
name = "usagesniffer"
version = "1.1.2"
description = "Scan Claude Code, Codex, Opencode, Gemini, Copilot, Cursor, Aider, and Continue sessions and visualize what eats your tokens"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "agents", "tokens", "usage", "claude", "codex", "opencode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13"]

[project.scripts]
usagesniffer = "usagesniffer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["usagesniffer*"]
