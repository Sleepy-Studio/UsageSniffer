name: publish
"on":
  release:
    types: [published]
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC, no token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: smoke test before publish
        run: python tests/smoke_fixtures.py
      - name: build dist
        run: pip install build && python -m build
      - name: publish to PyPI
        uses: pypi/gh-action-pypi-publish@release/v1
