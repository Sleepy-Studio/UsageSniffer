name: ci
"on": [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan (no local sessions on CI, must exit 1 cleanly)
        run: python -m usagesniffer scan --top 3 || true
      - name: fixture tests
        run: python tests/smoke_fixtures.py
      - name: skill conformance tests
        run: python tests/test_skill.py
