name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m usagesniffer scan --top 3 || true
      - run: python - <<'EOF'
        import json, tempfile, os
        from pathlib import Path
        from usagesniffer.parsers import claude, codex, gemini, continue_
        from usagesniffer import pricing, insights
        from usagesniffer.report import build_html
        from usagesniffer.models import ScanResult
        # synthetic claude session fixture
        d = Path(tempfile.mkdtemp())
        fx = d / "proj" ; fx.mkdir()
        rows = [
          {"type": "user", "message": {"content": "hello"}},
          {"type": "assistant", "message": {"model": "claude-sonnet-5", "content": [
            {"type": "text", "text": "hi there"},
            {"type": "tool_use", "name": "Bash", "input": {"command": "ls"}}],
            "usage": {"input_tokens": 100, "output_tokens": 50,
                      "cache_creation_input_tokens": 1000, "cache_read_input_tokens": 5000}}},
        ]
        (fx / "s1.jsonl").write_text("\n".join(json.dumps(r) for r in rows))
        ss = claude.scan(d)
        assert len(ss) == 1 and ss[0].total_tokens == 6150, ss
        assert ss[0].tools["Bash"] == 1
        c = pricing.session_cost(ss[0])
        assert c["total"] > 0 and c["saved_by_cache"] > 0, c
        html = build_html(ScanResult(ss))
        assert "UsageSniffer report" in html
        print("fixtures OK:", ss[0].total_tokens, "tokens, cost %.4f" % c["total"])
        EOF
